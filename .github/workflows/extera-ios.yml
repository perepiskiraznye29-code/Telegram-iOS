name: Extera iOS port

on:
  push:
    branches: [codex/extera-ios-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extera-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select project Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          test -d "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          df -h .
      - name: Import verification signing certificate
        run: python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
      - name: Build device IPA
        shell: bash
        run: |
          set -euo pipefail
          echo 'build --jobs=3' >> "$HOME/.bazelrc"
          echo 'build --local_resources=memory=HOST_RAM*0.65' >> "$HOME/.bazelrc"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$RUNNER_TEMP/extera-bazel" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="${{ github.run_number }}" \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/build/port-artifacts" \
            2>&1 | tee "$RUNNER_TEMP/extera-build.log"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-iOS-port-IPA
          path: build/port-artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-iOS-port-build-log
          path: ${{ runner.temp }}/extera-build.log
          if-no-files-found: ignore
          retention-days: 7
