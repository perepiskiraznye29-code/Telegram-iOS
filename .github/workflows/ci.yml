name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || true

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv /Users/Shared/$(basename "$GITHUB_WORKSPACE") /Users/Shared/telegram-ios

      - name: Patch and Build
        run: |
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          # 1. Флаги Bazel
          echo "build --incompatible_disallow_empty_glob=false" >> ~/.bazelrc
          echo "build --check_direct_dependencies=off" >> ~/.bazelrc
          echo "build --jobs=6" >> ~/.bazelrc

          # 2. Патч Network.swift
          python3 -c "
          p = 'submodules/TelegramCore/Sources/Network/Network.swift'
          with open(p, 'r') as f:
              content = f.read()
          content = content.replace('direction: .audio, category: .audio', 'direction: .outgoing, category: .audio')
          content = content.replace('var wrappedAdditionalSource: MTSignal?', 'var wrappedAdditionalSource: MTSignal?; _ = wrappedAdditionalSource')
          with open(p, 'w') as f:
              f.write(content)
          "

          # 3. Патч NativeWindowHostView.swift
          python3 -c "
          import re
          p = 'submodules/Display/Source/NativeWindowHostView.swift'
          with open(p, 'r') as f:
              c = f.read()
          c = re.sub(r'@available\(iOS 26\.0[^\}]*\}', '', c)
          c = re.sub(r'func preferredWindowingControlStyle\([^)]*\)[^{]*\{[^}]*\}', '', c)
          with open(p, 'w') as f:
              f.write(c)
          "

          # 4. Внедрение заглушек UIGlassEffect в GlassBackgroundComponent.swift
          python3 -c "
          p = 'submodules/TelegramUI/Components/GlassBackgroundComponent/Sources/GlassBackgroundComponent.swift'
          with open(p, 'r') as f:
              c = f.read()
          stubs = 'import UIKit\n\nprivate final class UIGlassEffect: UIVisualEffect {\n    var tintColor: UIColor? = nil\n    var isInteractive: Bool = false\n}\n\nprivate final class UIGlassContainerEffect: UIVisualEffect {\n    var spacing: CGFloat = 0.0\n}\n'
          with open(p, 'w') as f:
              f.write(stubs + '\n' + c)
          "

          # 5. Патч Telegram/BUILD (отключение Telegram.icon и alternate_icons)
          rm -rf Telegram/Telegram-iOS/Telegram.icon
          python3 -c "
          import re
          p = 'Telegram/BUILD'
          with open(p, 'r') as f:
              c = f.read()
          c = re.sub(r'glob\s*\([^)]*Telegram\.icon[^)]*\)', '[]', c, flags=re.DOTALL)
          c = re.sub(r'alternate_icons\s*=\s*\[[^\]]*\]', 'alternate_icons = []', c, flags=re.DOTALL)
          lines = [line for line in c.splitlines() if 'Telegram.icon' not in line]
          with open(p, 'w') as f:
              f.write('\n'.join(lines))
          "

          # 6. Отключение проверок версий actool
          find . -name "actool.bzl" -exec sed -i '' 's/fail("""/print("""/g' {} + 2>/dev/null || true

          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          export IGNORE_XCODE_VERSION_MISMATCH=1
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          # 7. Импорт сертификатов и компиляция
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # 8. Экспорт готового IPA
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          find bazel-out/ -name "*.ipa" -exec cp {} "$OUTPUT_PATH/Telegram.ipa" \;

          mkdir -p build/DSYMs
          find bazel-out/ -name "*.dSYM" -exec cp -R {} build/DSYMs/ \; 2>/dev/null || true
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null || true

      - name: Upload IPA as Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            An unsigned build of Telegram for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
