      - name: Build the App
        run: |
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          # Полностью удаляем проблемную папку иконки нового формата
          rm -rf Telegram/Telegram-iOS/Telegram.icon

          # Пропатчим BUILD-файл через Python, чтобы полностью удалить упоминания Telegram.icon из списка ресурсов приложения
          python3 -c "
build_path = 'Telegram/BUILD'
with open(build_path, 'r') as f:
    content = f.read()
# Удаляем строчку с Telegram.icon из массива ресурсов
content = content.replace('\"Telegram-iOS/Telegram.icon\",', '')
content = content.replace('\'Telegram-iOS/Telegram.icon\',', '')
with open(build_path, 'w') as f:
    f.write(content)
" || true

          # Отключаем проверку версии Xcode для Icon Composer в rules_apple
          find . -name "actool.bzl" -exec sed -i '' 's/fail("""/print("""/g' {} + 2>/dev/null || true

          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          export IGNORE_XCODE_VERSION_MISMATCH=1
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          find bazel-out/ -name "*.ipa" -exec cp {} $OUTPUT_PATH/Telegram.ipa \;

          mkdir -p build/DSYMs
          find bazel-out/ -name "*.dSYM" -exec cp -R {} build/DSYMs/ \; 2>/dev/null || true
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null || true
