name: CI

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          # Выбираем стабильный Xcode 15/16
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true

      - name: Install Build Tools
        run: |
          brew install bazelisk yasm cmake ninja
          pip3 install pbxproj

      - name: Build the App
        run: |
          set -x

          # Отключаем падение rules_apple при проверке версий
          find . -name "actool.bzl" -exec sed -i '' 's/fail("""/print("""/g' {} + 2>/dev/null || true

          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          export IGNORE_XCODE_VERSION_MISMATCH=1
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          # Импортируем тестовые сертификаты для сборки
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          # Подготавливаем минимальный конфиг без требований App Store
          mkdir -p "$HOME/telegram-configuration"
          if [ -f "build-system/template_minimal_development_configuration.json" ]; then
            cp build-system/template_minimal_development_configuration.json "$HOME/telegram-configuration/config.json"
          elif [ -f "build-system/minimal-development-configuration.json" ]; then
            cp build-system/minimal-development-configuration.json "$HOME/telegram-configuration/config.json"
          else
            cp build-system/appstore-configuration.json "$HOME/telegram-configuration/config.json"
          fi

          # Сборка с отключением тяжелых расширений и с фейк-подписью
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            build \
            --configurationPath="$HOME/telegram-configuration/config.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --disableExtensions

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          find bazel-out/ -name "*.ipa" -exec cp {} $OUTPUT_PATH/Telegram.ipa \;

      - name: Upload IPA as Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-IPA
          path: build/artifacts/Telegram.ipa
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            An unsigned build of Telegram for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          files: |
            build/artifacts/Telegram.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          files: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
